<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Museum — Timeline</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Timeline Overlay (Start Screen) -->
    <div id="timeline-overlay" class="timeline-overlay">
      <header class="timeline-header">
        <h1>🎨 Virtual Museum</h1>
        <p id="timeline-subtitle">Explore masterpieces across 8 epochs of art history</p>
      </header>

      <!-- Search & Filter Bar -->
      <div class="search-bar">
        <input type="text" id="artist-search" class="search-input" placeholder="🔍 Search artists, movements, nationalities..." autocomplete="off" />
        <div class="filter-chips" id="filter-chips">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="Vorreformatorisch">Proto-Renaissance</button>
          <button class="filter-chip" data-filter="Renaissance">Renaissance</button>
          <button class="filter-chip" data-filter="Barock">Baroque</button>
          <button class="filter-chip" data-filter="Romantik">Romanticism</button>
          <button class="filter-chip" data-filter="Impressionismus">Impressionism</button>
          <button class="filter-chip" data-filter="Moderne">Modern</button>
          <button class="filter-chip" data-filter="Zeitgenössisch">Contemporary</button>
          <button class="filter-chip" data-filter="Asiatische Kunst">Asian Art</button>
        </div>
        <button id="surprise-btn" class="surprise-button">🎲 Surprise Me!</button>
      </div>

      <!-- Search Results Panel -->
      <div id="search-results" class="search-results" hidden>
        <div class="search-results-header">
          <span id="search-results-count"></span>
          <button id="clear-search" class="icon-button small" type="button">×</button>
        </div>
        <div class="search-results-grid" id="search-results-grid"></div>
      </div>

      <!-- Galaxy Timeline -->
      <div class="timeline-stage" id="timeline-stage">
        <!-- Starfield canvas (background only) -->
        <canvas id="starfield-canvas" aria-hidden="true"></canvas>

        <!-- Interactive timeline layer (HTML elements) -->
        <div class="timeline-viewport" id="timeline-viewport">
          <div class="timeline-world" id="timeline-world">
            <!-- Epoch markers injected by JS -->
          </div>
        </div>

        <div class="timeline-hint">🖱️ Scroll to zoom · Drag to pan · Click an epoch to explore</div>
      </div>

      <!-- Epoch detail panel -->
      <div id="epoch-detail" class="epoch-detail" hidden>
        <button id="close-epoch-detail" class="icon-button" type="button" aria-label="Close epoch detail">×</button>
        <div class="epoch-detail-header">
          <h2 id="epoch-detail-name"></h2>
          <p id="epoch-detail-range" class="years"></p>
        </div>
        <div class="epoch-artists-grid" id="epoch-artists-grid"></div>
        <button id="enter-museum-btn" class="cta-button">Enter 3D Museum Hall →</button>
      </div>
    </div>

    <!-- 3D Museum View -->
    <main id="museum-view" class="museum-view" hidden>
      <!-- Canvas created dynamically by initMuseumScene -->

      <section id="info-panel" class="panel" aria-live="polite" hidden>
        <button id="close-panel" class="icon-button" type="button" aria-label="Close artist panel">×</button>
        <div class="panel-carousel">
          <img id="artist-image" alt="" />
          <div class="carousel-nav">
            <button id="carousel-prev" class="carousel-btn" type="button" aria-label="Previous artwork">‹</button>
            <span id="carousel-counter" class="carousel-counter"></span>
            <button id="carousel-next" class="carousel-btn" type="button" aria-label="Next artwork">›</button>
          </div>
        </div>
        <div class="panel-content">
          <p id="artist-years" class="years"></p>
          <h1 id="artist-name"></h1>
          <p id="artist-bio"></p>
          <div class="panel-actions">
            <button id="tts-btn" class="tts-button" type="button" aria-label="Read biography aloud">🔊 Read aloud</button>
            <a id="artist-url" href="#" target="_blank" rel="noreferrer">Open image source</a>
          </div>
        </div>
      </section>

      <div id="hud">
        <strong id="hud-title">Virtual Museum</strong>
        <span id="hud-hint">Click the room to look around. WASD moves, mouse drags/locks view, hold Shift or Space to click paintings.</span>
        <button id="back-to-timeline" class="hud-button">← Back to Timeline</button>
      </div>

      <!-- Mobile touch controls (hidden on desktop) -->
      <div id="touch-controls" class="touch-controls" hidden>
        <div id="touch-joystick" class="touch-joystick">
          <div id="touch-joystick-knob" class="touch-joystick-knob"></div>
        </div>
        <div id="touch-look" class="touch-look"></div>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
