<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Renaissance Museum</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="museum-canvas" aria-label="3D virtual museum room"></canvas>

      <section id="info-panel" class="panel" aria-live="polite" hidden>
        <button id="close-panel" class="icon-button" type="button" aria-label="Close artist panel">x</button>
        <img id="artist-image" alt="" />
        <div class="panel-content">
          <p id="artist-years" class="years"></p>
          <h1 id="artist-name"></h1>
          <p id="artist-bio"></p>
          <a id="artist-url" href="#" target="_blank" rel="noreferrer">Open image source</a>
        </div>
      </section>

      <div id="hud">
        <strong>Virtual Renaissance Museum</strong>
        <span>Click the room to look around. WASD moves, mouse drags/locks view, click a painting for details.</span>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
